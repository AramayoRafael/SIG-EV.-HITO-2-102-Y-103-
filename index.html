const MINICASOS = [{"id":"MC-01","org":"Ferretería Los Andes","text":"Ferretería Los Andes reemplazó su cuaderno de inventario por lectores de código de barras, tableros en pantalla y alertas al celular del dueño cuando un producto baja de diez unidades. Vende los mismos artículos, al mismo público del barrio y en el mismo local. El dueño sigue decidiendo cada reposición: antes miraba el cuaderno, ahora mira el tablero.","signals":[{"id":"S2","text":"El dueño sigue tomando por sí mismo cada decisión de reposición."},{"id":"S3","text":"Los lectores de código de barras registran los productos automáticamente."},{"id":"S4","text":"El celular del dueño recibe alertas que antes nadie enviaba."},{"id":"S5","text":"El cuaderno de papel desapareció del negocio."},{"id":"S1","text":"Vende los mismos artículos, al mismo público del barrio y en el mismo local."}]},{"id":"MC-02","org":"Estudio contable Vargas & Asociados","text":"El estudio digitalizó veinte años de archivadores: hoy cada expediente se consulta en pantalla y las declaraciones se firman en PDF. Atiende a los mismos clientes, ofrece los mismos servicios y cobra por trámite igual que antes. El contador revisa cada declaración antes de enviarla, como lo hacía con el papel; solo cambió dónde está guardado el documento.","signals":[{"id":"S3","text":"Veinte años de archivadores pasaron a formato digital."},{"id":"S5","text":"Los expedientes se consultan en pantalla y ya no en un estante."},{"id":"S2","text":"El contador revisa cada declaración antes de enviarla, como con el papel."},{"id":"S1","text":"Ofrece los mismos servicios y cobra por trámite igual que antes."},{"id":"S4","text":"Las declaraciones ahora se firman en PDF."}]},{"id":"MC-03","org":"Colegio San Ignacio","text":"Las libretas de notas del colegio se llenan ahora en una planilla en línea y los padres reciben el informe por correo en lugar de recogerlo impreso. El calendario de evaluaciones, las materias y la forma de calificar no cambiaron. Cada docente sigue decidiendo la nota con los mismos criterios; lo que cambió es cómo llega el informe a la familia.","signals":[{"id":"S1","text":"El calendario, las materias y la forma de calificar no cambiaron."},{"id":"S3","text":"Las libretas se llenan en una planilla en línea."},{"id":"S5","text":"Ya no se imprime la libreta en papel."},{"id":"S4","text":"Los padres reciben el informe por correo electrónico."},{"id":"S2","text":"Cada docente sigue decidiendo la nota con los mismos criterios."}]},{"id":"MC-04","org":"Flota Chapare","text":"La empresa de buses cambió el boleto de papel por boleto electrónico, instaló pantallas con horarios en la terminal y ahora vende pasajes en línea. Mantiene los mismos destinos, los mismos horarios y las mismas tarifas, y el jefe de tráfico sigue asignando cada bus a mano sobre una pizarra. El pasajero hace el mismo viaje; cambió cómo obtiene su boleto.","signals":[{"id":"S1","text":"Mantiene los mismos destinos, los mismos horarios y las mismas tarifas."},{"id":"S3","text":"El boleto de papel fue reemplazado por un boleto electrónico."},{"id":"S4","text":"Instalaron pantallas con los horarios en la terminal."},{"id":"S5","text":"Ahora se puede comprar el pasaje en línea."},{"id":"S2","text":"El jefe de tráfico sigue asignando los buses a mano sobre una pizarra."}]},{"id":"MC-05","org":"Taller metalúrgico Ferrotec","text":"Ferrotec compró una cortadora de control numérico que reemplaza el corte manual y programa cada pieza desde un archivo. Es la inversión más grande de su historia. Sigue fabricando las mismas piezas, para los mismos tres clientes industriales, con el mismo contrato y el mismo precio por pieza. El jefe de taller decide qué se corta cada día igual que antes.","signals":[{"id":"S3","text":"La cortadora de control numérico programa las piezas desde un archivo."},{"id":"S5","text":"El corte manual desapareció del taller."},{"id":"S1","text":"Fabrica las mismas piezas, para los mismos clientes y al mismo precio."},{"id":"S2 id":"S1","text":"Cobra por hectárea monitoreada en lugar de cobrar por producto entregado."}]},{"id":"MC-11","org":"Cooperativa Kausay","text":"La cooperativa aprobaba cada crédito en un comité que se reunía los viernes. Hoy un modelo de evaluación aprueba los montos pequeños en minutos y el comité solo revisa las excepciones. Con eso empezó a atender a comerciantes que antes no alcanzaban a pasar por el comité, y el crédito pequeño se volvió su producto principal.","signals":[{"id":"S1","text":"La decisión sobre los montos pequeños pasó del comité al sistema."},{"id":"S4","text":"El comité de los viernes todavía existe."},{"id":"S3","text":"La evaluación de los créditos se hace por computadora."},{"id":"S5","text":"Los créditos se aprueban más rápido que antes."},{"id":"S2","text":"Atiende a clientes que antes no llegaba a atender y cambió su producto principal."}]},{"id":"MC-12","org":"Radio Sur","text":"La radio transmitía por FM en horarios fijos y vivía de la publicidad de los comercios del barrio. Hoy produce episodios que el oyente escucha cuando quiere, cobra una membresía mensual a sus seguidores y vende patrocinio por episodio. La parrilla de horarios dejó de existir y el equipo decide qué producir según qué episodios se escuchan.","signals":[{"id":"S5","text":"La radio sigue haciendo entrevistas y música."},{"id":"S2","text":"Desapareció la parrilla de horarios: el oyente elige cuándo escuchar."},{"id":"S3","text":"Los programas se graban en formato digital."},{"id":"S4","text":"El equipo revisa cuántas personas escuchan cada episodio."},{"id":"S1","text":"Cobra membresía y patrocinio por episodio en lugar de publicidad por horario."}]}];

function evidenciaTexto(id){const c=(currentCase.cards||[]).find(x=>x.id===id);return c?id+' · '+c.text:id;}
function diagramaTexto(nodes,nivel){nivel=nivel||0;const sangria='  '.repeat(nivel);
 return (nodes||[]).map(n=>{let t=sangria+FLOW_TYPES[n.type].name+' ['+n.id+']: '+flowNodeText(n);
  if(n.type==='input'&&n.source)t+=' · dato '+n.source;
  if(n.type==='if')t+='\n'+sangria+' SÍ:\n'+diagramaTexto(n.yes,nivel+2)+'\n'+sangria+' NO:\n'+diagramaTexto(n.no,nivel+2);
  return t;}).join('\n');}
function indiciosTexto(i){const d=miniState(i),m=d.meta,min=m.activeMs/60000,netos=Math.max(0,d.text.trim().length-m.pastedChars);
 return[m.pastes+' pegado(s)',m.pastedChars+' caracteres pegados',m.typed+' pulsaciones',
  Math.round(m.activeMs/1000)+' s de escritura',(min>0?Math.round(netos/min):0)+' caracteres netos por minuto',

function filaParaSheet(bloque){
 const a=state.answers,f=a.flow||{},t=flowTask(),fila={};
 fila['Código']=state.code;
 fila['Caso']=currentCase.id;
 fila['Organización']=currentCase.org;
 fila['Integrantes']=state.members.length;
 state.members.forEach((m,i)=>{fila['Integrante '+(i+1)]=m.name;});
 fila['Bloques completos']=[state.blocks.q1?'P1':'',state.blocks.q2?'P2':''].filter(Boolean).join(' + ')||'ninguno';
 fila['Finalizado']=state.finishedAt||'';
 fila['Acuerdo del equipo']=a.agreement?'Sí':'No';

 if(bloque==='q1'||bloque==='todo'){
  FUNCS.forEach(([k],i)=>{const r=a.functions[k]||{text:'',evidence:[]};
   fila['P1 '+GUIDES[i].name]=r.text;
   fila['P1 '+GUIDES[i].name+' · evidencias']=(r.evidence||[]).map(evidenciaTexto).join('\n');});
 }
 if(bloque==='q2'||bloque==='todo'){
  fila['P2 Tarea']=t.title;
  fila['P2 Variables']=flowAll(f.nodes||[]).filter(n=>n.type==='declare').map(n=>n.name||'sin nombre').join(', ');
  fila['P2 Bloques']=flowAll(f.nodes||[]).length;
  fila['P2 Revisión']=f.revision||0;
  fila['P2 Diagrama']=diagramaTexto(f.nodes||[])||'Sin diagrama';
  state.members.forEach((m,i)=>{const c=miniCaso(state.code,i),d=miniState(i),n=i+1;
   fila['MC'+n+' Código']=c.id;
   fila['MC'+n+' Empresa']=c.org;
   fila['MC'+n+' Clasificación']=d.choice==='TD'?'Transformación digital':d.choice==='DIG'?'Digitalización':'Sin responder';
   fila['MC'+n+' Hechos marcados']=c.signals.filter(x=>d.signals.includes(x.id)).map(x=>x.id+' · '+x.text).join('\n')||'Ninguno';
   fila['MC'+n+' Explicación']=d.text;
   fila['MC'+n+' Indicios']=indiciosTexto(i);});
 }
 return fila;
}

const ENVIO={enCurso:false};
function pendientes(){try{return JSON.parse(localRead('pend:'+state.code)||'[]');}catch(e){return[];}}
function guardarPendientes(l){localWrite('pend:'+state.code,JSON.stringify([...new Set(l)]));}
function estadoRed(txt,ok){const el=$('netLabel');if(!el)return;el.textContent=txt;el.className='net-label'+(ok===true?' net-ok':ok===false?' net-bad':'');}

async function enviarAlSheet(bloque,opciones){
 opciones=opciones||{};
 if(!CONFIG.URL_SCRIPT||!CONFIG.ENVIAR_AL_SHEET)return{ok:false,motivo:'sin conexión configurada'};
 if(demo&&!opciones.prueba)return{ok:false,motivo:'modo práctica'};
 const cuerpo={evaluacionId:CONFIG.EVALUACION_ID,codigo:opciones.codigo||state.code,bloque,
  estado:opciones.prueba?'PRUEBA':'REAL',fila:opciones.fila||filaParaSheet(bloque),
  crudo:opciones.prueba?{prueba:true}:payload()};
 try{
  ENVIO.enCurso=true;estadoRed('Enviando…');
  const ctrl=new AbortController(),corte=setTimeout(()=>ctrl.abort(),20000);
  const r=await fetch(CONFIG.URL_SCRIPT,{method:'POST',redirect:'follow',signal:ctrl.signal,
   headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(cuerpo)});
  clearTimeout(corte);
  const j=await r.json();
  if(!j.ok)throw new Error(j.error||'respuesta inesperada del servidor');
  if(!opciones.prueba){guardarPendientes(pendientes().filter(b=>b!==bloque));
   state.delivery=state.delivery||{};state.delivery[bloque]={ok:true,at:new Date().toISOString(),fila:j.fila};persist(false);}
  estadoRed('Enviado al docente',true);
  return{ok:true,fila:j.fila};
 }catch(err){
  if(!opciones.prueba){guardarPendientes([...pendientes(),bloque]);}
  estadoRed('Guardado aquí, falta enviar',false);
  return{ok:false,motivo:String(err&&err.message?err.message:err)};
 }finally{ENVIO.enCurso=false;}
}

async function reenviarPendientes(silencioso){
 const p=pendientes();
 if(!p.length){if(!silencioso)notify('No hay envíos pendientes.');return;}
 for(const b of p)await enviarAlSheet(b);
 const quedan=pendientes();
 if(!silencioso)notify(quedan.length?'Todavía quedan '+quedan.length+' envío(s) pendientes.':'Envíos pendientes completados.');
}

  <div><label id="miniChoiceLabel${i}">¿Qué ocurrió en ${esc(c.org)}?</label><div class="choice-grid mc-choice" role="group" aria-labelledby="miniChoiceLabel${i}">${[['DIG','Digitalización'],['TD','Transformación digital']].map(([v,n])=>`<button type="button" class="choice-card" data-mini-choice="${i}|${v}" aria-pressed="${d.choice===v}"><b>${n}</b></button>`).join('')}</div></div>
  <div><label>¿Qué dos hechos del mini-caso sostienen esa elección?</label><div class="evidence-picker">${c.signals.map(s=>`<label class="evidence-choice"><input type="checkbox" data-mini-signal="${i}|${s.id}" ${d.signals.includes(s.id)?'checked':''}><span>${esc(s.text)}</span></label>`).join('')}</div><small id="miniSignals${i}">${d.signals.length} de 2 marcados</small></div>
  <div><label for="miniText${i}">Expliquen con sus palabras por qué es ese caso y no el otro</label><textarea id="miniText${i}" maxlength="900" placeholder="En ${esc(c.org)} cambió… pero se mantuvo igual…">${esc(d.text)}</textarea><div class="row between"><small class="sentence-hint">Usen los dos hechos que marcaron. Digan qué cambió y qué se mantuvo igual en esta empresa; no escriban la definición del concepto.</small><small id="miniCount${i}">${d.text.trim().length} caracteres</small></div></div></section>`;}).join('');
 $('q2Content').innerHTML=`<section class="panel focus-panel stack"><span class="task-tag">ANÁLISIS DE CONCEPTOS</span><h3>Su equipo recibe ${state.members.length} mini-casos distintos.</h3><p class="muted">Léanlos y clasifíquenlos juntos. Cada mini-caso se responde una sola vez para todo el equipo.</p><details class="mini-help"><summary>Recordar la diferencia entre los dos conceptos</summary><p><b>Digitalización.</b> Una actividad que ya existía pasa a un soporte digital. Cambia el medio; el negocio, el cliente y quien decide siguen siendo los mismos.</p><p style="margin-top:10px"><b>Transformación digital.</b> Lo digital cambia el negocio mismo: qué se ofrece, cómo se cobra, a quién se llega o quién toma la decisión.</p><p class="muted" style="margin-top:10px">La cantidad de tecnología no define la respuesta. Hay empresas con mucha tecnología que hacen exactamente lo mismo de antes.</p></details></section>${bloques}<p class="error" id="q2Error" role="alert" hidden></p><div class="footer-actions"><button id="flowDefenseBack" class="ghost">← Volver al diagrama</button><button id="flowSaveQ2" class="primary">Guardar pregunta 2 · revisar entrega →</button></div>`;
 document.querySelectorAll('[data-mini-choice]').forEach(b=>b.onclick=()=>{const[i,v]=b.dataset.miniChoice.split('|'),d=miniState(Number(i));if(d.choice!==v){if(d.choice)d.meta.choiceChanges++;d.choice=v;}b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));dirtyQ2();});
 document.querySelectorAll('[data-mini-signal]').forEach(el=>el.onchange=()=>{const[raw,sid]=el.dataset.miniSignal.split('|'),i=Number(raw),d=miniState(i);if(el.checked){if(d.signals.length>=2){el.checked=false;notify('Marquen exactamente dos hechos. Desmarquen uno antes de elegir otro.');return;}d.signals=[...new Set([...d.signals,sid])];}else d.signals=d.signals.filter(x=>x!==sid);$('miniSignals'+i).textContent=d.signals.length+' de 2 marcados';dirtyQ2();});
 state.members.forEach((m,i)=>{const el=$('miniText'+i),d=miniState(i),meta=d.meta;
  el.addEventListener('paste',e=>{const t=((e.clipboardData||window.clipboardData)?.getData('text'))||'';meta.pastes++;meta.pastedChars+=t.length;});
  el.addEventListener('input',e=>{const now=Date.now();if(!meta.firstAt)meta.firstAt=new Date(now).toISOString();if(meta.lastAt){const gap=now-Date.parse(meta.lastAt);if(gap>0&&gap<15000)meta.activeMs+=gap;}meta.lastAt=new Date(now).toISOString();if(!e.inputType||e.inputType==='insertText')meta.typed++;d.text=el.value;$('miniCount'+i).textContent=d.text.trim().length+' caracteres';dirtyQ2();});});
 $('flowDefenseBack').onclick=()=>{q2Stage=1;renderQ2();};
 $('flowSaveQ2').onclick=()=>{const errors=validateQ2();if(errors.length){showErrors('q2Error',errors);return;}checkpoint('q2');state.blocks.q2=true;persist(false);notify('Pregunta 2 guardada. Revisen la entrega del equipo.');enviarAlSheet('q2');navigate(3);};}
function validateQ2(){if(!state.answers.flow)return['Completen la pregunta 2.'];const f=state.answers.flow,errors=flowStructure(f.nodes);state.members.forEach((m,i)=>{const c=miniCaso(state.code,i),d=miniState(i);const falta=[];if(!d.choice)falta.push('elegir una opción');if(d.signals.length!==2)falta.push('marcar dos hechos');if(d.text.trim().length<MINI_MIN)falta.push('escribir la explicación (mínimo '+MINI_MIN+' caracteres)');if(falta.length)errors.push('En el mini-caso de '+esc(c.org)+' falta '+falta.join(', ')+'.');});return errors;}
function counts(){if(!state)return[0,1];const a=state.answers,f=a.flow;const flags=[...GUIDES.flatMap((guide,i)=>{const answer=a.functions[FUNCS[i][0]];return[answer.text.trim().length>=guide.min,answer.evidence.length>0];}),!!f&&flowStructure(f.nodes).length===0,...state.members.flatMap((m,i)=>{const d=miniState(i);return[!!d.choice,d.signals.length===2,d.text.trim().length>=MINI_MIN]})];return[flags.filter(Boolean).length,flags.length];}
function checkpoint(block){state.revision++;const a=state.answers;state.history.push({revision:state.revision,block,at:new Date().toISOString(),answers:flowCopy(block==='q1'?{functions:a.functions}:{flow:a.flow,minicases:a.minicases})});if(state.history.length>12)state.history.shift();}
function payload(){const copy=flowCopy(state);copy.members=state.members.map(m=>({name:m.name}));return{...copy,caseSnapshot:currentCase,flowTaskSnapshot:flowTask(),participants:state.members.map((m,i)=>({memberNumber:i+1,studentName:m.name,groupCode:state.code})),minicases:state.members.map((m,i)=>miniExport(i)),delivery:{mode:'local',serverConfirmed:false},exportedAt:new Date().toISOString()};}
function flowReportNodes(nodes){return`<ol>${nodes.map(n=>`<li><b>${FLOW_TYPES[n.type].name} · ${esc(n.id)}</b>: ${esc(flowNodeText(n))}${n.type==='input'?' · dato de prueba: '+esc(n.source):''}${n.type==='if'?`<div class="report-branches"><div><b>Sí · verdadero</b>${flowReportNodes(n.yes)}</div><div><b>No · falso</b>${flowReportNodes(n.no)}</div></div><p>Unión de las ramas; continuar debajo.</p>`:''}</li>`).join('')}</ol>`;}
function reportHTML(){const a=state.answers,f=a.flow;const evidence=ids=>ids.map(id=>{const card=currentCase.cards.find(f=>f.id===id);return card?id+': '+card.text:id}).join('\n');return `<h1>Sistemas de información gerencial</h1><p>UNIFRANZ · Evaluación por equipos · Versión 4.2</p><p><b>Equipo:</b> ${esc(state.code)} · <b>Caso:</b> ${esc(currentCase.id)} · ${esc(currentCase.org)}</p><p>${state.members.map(m=>esc(m.name)+'').join('<br>')}</p><p>Estado: ${state.finishedAt?'entrega finalizada':'borrador'} · ${[state.blocks.q1?'pregunta 1 guardada':'pregunta 1 pendiente',state.blocks.q2?'pregunta 2 guardada':'pregunta 2 pendiente'].join(' · ')}. ${(state.delivery&&(state.delivery.q1?.ok||state.delivery.q2?.ok))?'Enviado al docente.':'Sin envío confirmado al docente: conserven este PDF.'}</p><h2>Caso asignado</h2><p>${esc(currentCase.context)}</p><p><b>Reglas:</b> ${esc(currentCase.rules)}</p><h2>Pregunta 1 · El sistema</h2>${FUNCS.map(([key,name])=>`<div class="report-card"><h3>${name}</h3><p class="report-answer">${esc(a.functions[key].text||'Sin respuesta')}</p><p><b>Evidencias seleccionadas:</b></p><p class="report-answer">${esc(evidence(a.functions[key].evidence)||'Ninguna')}</p></div>`).join('')}<h2>Pregunta 2 · Diagrama de flujo</h2><h3>${esc(flowTask().title)}</h3><p>${esc(flowTask().scope)}</p><p>${esc(flowTask().rule)}</p><p><b>Salida solicitada:</b> ${esc(flowTask().output)}</p>${f&&f.nodes.length?`<div class="report-diagram">${flowSvg(f.nodes)}</div><h3>El mismo diagrama, en texto</h3><p><b>Principal</b></p>${flowReportNodes(f.nodes)}<p><b>Fin</b></p>`:'<p>Diagrama pendiente: el equipo no construyó bloques.</p>'}<h2>Análisis de conceptos · Digitalización o transformación digital</h2>${state.members.map((m,i)=>{const c=miniCaso(state.code,i),d=miniState(i);return `<div class="report-card"><h3>Mini-caso ${i+1} · ${esc(c.id)} ${esc(c.org)}</h3><p>${esc(c.text)}</p><p><b>Clasificación:</b> ${d.choice==='TD'?'Transformación digital':d.choice==='DIG'?'Digitalización':'Sin responder'}</p><p><b>Hechos marcados:</b></p><ul>${c.signals.filter(s=>d.signals.includes(s.id)).map(s=>'<li>'+esc(s.text)+'</li>').join('')||'<li>Ninguno</li>'}</ul><p><b>Explicación:</b></p><p class="report-answer">${esc(d.text)||'Sin respuesta'}</p></div>`}).join('')}<p>Revisión del equipo: ${a.agreement?'aceptada':'pendiente'} · ${esc(new Date().toLocaleString('es-BO'))}</p>`;}

function flowMoveOptions(n){const excluded=new Set(flowAll([n]).map(x=>x.id));return[['main','Final del recorrido principal'],...flowAll(state.answers.flow.nodes).filter(x=>x.type==='if'&&!excluded.has(x.id)).flatMap(x=>[[x.id+':yes',x.id+' · final de Verdadero'],[x.id+':no',x.id+' · final de Falso']])];}

function flowMoveNode(id,target){const n=flowFind(id),loc=flowLocate(id);if(!n||!loc||!flowMoveOptions(n).some(([k])=>k===target))return false;const lane=flowLane(target);if(!lane)return false;flowChange(()=>{loc.lane.splice(loc.index,1);lane.push(n);});return true;}

function flowDecisionTrace(events){return events.filter(e=>e.branch).map(e=>({id:e.id,condition:e.detail,branch:e.branch}));}

function flowTraceHTML(events){return flowDecisionTrace(events).map(e=>`<p><b>${esc(e.id)} → ${e.branch==='yes'?'Verdadero':'Falso'}</b><br>${esc(e.condition)}</p>`).join('');}

function flowPanTo(id){const canvas=$('flowCanvas');if(!canvas)return;const el=canvas.querySelector('[data-flow-node="'+id+'"]')||(id?.endsWith('-merge')?canvas.querySelector('[data-flow-merge="'+id.slice(0,-6)+'"]'):null);if(el?.getBBox){const b=el.getBBox();canvas.scrollTop=Math.max(0,b.y+b.height/2-canvas.clientHeight/3);canvas.scrollLeft=Math.max(0,b.x+b.width/2-canvas.clientWidth/2);}else if(id==='start'){const svg=canvas.querySelector('svg');if(svg){canvas.scrollTop=0;canvas.scrollLeft=Math.max(0,Number(svg.getAttribute('width'))/2-canvas.clientWidth/2);}}}

login();const params=new URLSearchParams(location.search);if(params.has('docente'))teacher();if(params.has('limpiar')){modal('Limpiar este dispositivo','Se eliminarán únicamente los borradores de esta evaluación guardados en este navegador. Descarguen sus respaldos antes de continuar.',[{label:'Cancelar',action:closeModal},{label:'Borrar borradores locales',action:()=>{try{Object.keys(localStorage).filter(k=>k.startsWith(PREFIX)).forEach(k=>localStorage.removeItem(k))}catch(e){$('storageWarning').hidden=false}closeModal();login()}}]);}
</script></body></html>
